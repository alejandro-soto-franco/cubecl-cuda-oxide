[package]
name = "cubecl-cuda-oxide"
version = "0.1.0"
edition = "2024"
description = "CubeCL backend that compiles kernels to PTX via cuda-oxide's LLVM-NVPTX pipeline (no nvrtc, no rustc)."
license = "MIT OR Apache-2.0"

[features]
# Off by default; matches the optional tracing instrumentation in the vendored
# compute server. Enabling it would require a `tracing` dependency.
tracing = []

[lints.rust]
# `cuda_12080` is a custom cfg the upstream cubecl-cuda build script emits from
# the detected CUDA toolkit version. We vendor the gated branches verbatim; the
# branch is simply inactive unless that cfg is set.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cuda_12080)'] }

[dependencies]
# CubeCL, pinned to the exact rev Burn uses. Feature set matches cubecl-cuda's
# so the vendored compute server resolves (streams, compilation cache, hashing).
cubecl = { git = "https://github.com/tracel-ai/cubecl", default-features = false, rev = "1d628d7e8fa6ac27c67195b35736de0b63cc2839" }
cubecl-core = { git = "https://github.com/tracel-ai/cubecl", default-features = false, rev = "1d628d7e8fa6ac27c67195b35736de0b63cc2839", features = [
    "std",
] }
cubecl-runtime = { git = "https://github.com/tracel-ai/cubecl", default-features = false, rev = "1d628d7e8fa6ac27c67195b35736de0b63cc2839", features = [
    "std",
    "channel-mutex",
] }
cubecl-common = { git = "https://github.com/tracel-ai/cubecl", default-features = false, rev = "1d628d7e8fa6ac27c67195b35736de0b63cc2839", features = [
    "std",
    "compilation-cache",
    "hash",
] }

# cuda-oxide (local path deps during development; switch to git for publish).
mir-importer = { path = "../cuda-oxide/crates/mir-importer" }
dialect-mir = { path = "../cuda-oxide/crates/dialect-mir" }
dialect-nvvm = { path = "../cuda-oxide/crates/dialect-nvvm" }
# Same git/rev as cuda-oxide workspace uses, so cargo unifies the pliron build.
pliron = { git = "https://github.com/pliron-org/pliron", rev = "222dd962a124cba8ec5f119ae6e0ecf202630854" }

# Verbatim cudarc line from the cubecl workspace (cubecl-cuda/Cargo.toml).
cudarc = { version = "0.19.6", features = [
    "std",
    "driver",
    "nvrtc",       # kept for cubecl dep-graph unification; unused on the cuda-oxide PTX path
    "nccl",
    "fallback-dynamic-loading",
    "cuda-version-from-build-system",
    "fallback-latest",
], default-features = false }

bytemuck = "1"
derive-new = { version = "0.7.0", default-features = false }
serde = { version = "1", features = ["derive"] }
log = "0.4"

# Burn backend integration: CubeBackend<CudaOxideRuntime> = CudaOxide.
burn-backend = { path = "../burn/crates/burn-backend", version = "0.22.0-pre.1", default-features = false, features = ["std"] }
burn-cubecl = { path = "../burn/crates/burn-cubecl", version = "0.22.0-pre.1", default-features = false, features = ["std"] }

[dev-dependencies]
# Task 9 e2e + parity. This burn rev dropped the `Tensor<B>` backend type
# parameter in favour of closed-world dynamic dispatch (`burn-dispatch`'s
# compile-time `backend_list!`), which cannot route to an out-of-tree backend.
# The integration therefore drives the `burn_backend::Backend` trait directly
# on the concrete `CudaOxide` type (`float_from_data`/`float_add`/
# `float_into_data`), which is the genuine end-to-end op path.
#
# `burn-cuda` is the stock nvrtc backend used to generate the checked-in parity
# reference. Default features (fusion/autotune) are off so it is a plain
# `CubeBackend<CudaRuntime>`, structurally identical to `CudaOxide`.
burn-cuda = { path = "../burn/crates/burn-cuda", version = "0.22.0-pre.1", default-features = false, features = ["std"] }
serde_json = "1"
